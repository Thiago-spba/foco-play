<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FocoPlay: Produtividade</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* --- TEMA CLEAN & SOFT --- */
        :root {
            --bg-cream: #F8F9F4; /* Fundo Creme/Bege suave */
            --card-white: #FFFFFF;
            --primary-blue: #0284c7; /* Sky Blue 600 */
            --primary-green: #0d9488; /* Teal 600 */
            --accent-green: #10b981; /* Emerald 500 (Acerto) */
            --accent-red: #ef4444; /* Red 500 (Erro) */
            --accent-orange: #f59e0b; /* Amber 500 (Tempo Esgotado) */
        }

        body {
            background-color: var(--bg-cream);
            color: #334155; /* Texto principal Slate 700 */
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden; /* Evita rolagem da página inteira, a rolagem será dentro da carta */
        }

        /* Estrutura Responsiva Dinâmica */
        .game-wrapper {
            height: 100vh;
            height: 100dvh; /* Para navegadores mobile modernos */
            display: flex;
            flex-direction: column;
        }

        .card-container {
            width: 100%;
            max-width: 32rem; /* máx 512px */
            /* A altura se adapta ao espaço restante, garantindo que não corte a tela */
            flex: 1; 
            max-height: 700px;
            margin: 0 auto;
        }

        /* Mecânica 3D da Carta */
        .perspective-1000 { perspective: 1200px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
        .flip-card-inner { transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); }

        /* Estilização da Carta */
        .clean-card {
            background: var(--card-white);
            border: 1px solid #e2e8f0;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            border-radius: 1.5rem; /* 24px */
        }

        /* Barra de rolagem suave e fina para os botões */
        .scrollable-content::-webkit-scrollbar { width: 6px; }
        .scrollable-content::-webkit-scrollbar-track { background: transparent; }
        .scrollable-content::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 10px; }

        /* Timer Animado */
        .timer-bar { transition: width 1s linear, background-color 0.3s ease; }
    </style>
</head>
<body>

    <div class="game-wrapper">
        <!-- Cabeçalho -->
        <header class="bg-white px-4 py-3 shadow-sm border-b border-slate-200 z-10">
            <div class="max-w-md mx-auto flex justify-between items-center">
                <h1 class="text-xl font-bold text-slate-700">Foco<span class="text-[#0284c7]">Play</span></h1>
                <div class="text-sm font-semibold text-slate-600 bg-slate-100 px-3 py-1 rounded-lg border border-slate-200">
                    Acertos: <span id="scoreDisplay" class="text-[#0d9488] font-bold text-base">0</span> / 30
                </div>
            </div>
            
            <!-- Barra do Timer -->
            <div class="max-w-md mx-auto mt-3 bg-slate-100 rounded-full h-2 overflow-hidden border border-slate-200">
                <div id="timerBar" class="timer-bar bg-[#0d9488] h-full w-full"></div>
            </div>
            <div class="max-w-md mx-auto mt-1 flex justify-between text-xs font-bold text-slate-400">
                <span id="timerText">20s restantes</span>
                <span id="questionCounter">Questão 1</span>
            </div>
        </header>

        <!-- Área Principal de Jogo -->
        <main class="flex-1 w-full p-4 md:p-6 flex items-center justify-center relative">
            
            <!-- Tela Final -->
            <div id="endScreen" class="hidden text-center max-w-md mx-auto clean-card p-8 w-full animate-fade-in z-20 absolute">
                <div class="w-20 h-20 mx-auto bg-[#0d9488] text-white rounded-full flex items-center justify-center text-4xl mb-4 shadow-lg shadow-teal-200">🏆</div>
                <h2 class="text-3xl font-bold text-slate-800 mb-2">Simulado Concluído!</h2>
                <p class="text-slate-600 mb-8 text-lg">Você acertou <strong id="finalScore" class="text-[#0d9488] text-2xl">0</strong> questões.</p>
                <button onclick="location.reload()" class="bg-[#0284c7] text-white font-bold py-3.5 px-6 rounded-xl w-full hover:bg-sky-700 transition shadow-md active:scale-95">
                    Reiniciar Simulado
                </button>
            </div>

            <!-- Card Container Responsivo -->
            <div id="gameContainer" class="card-container perspective-1000">
                <div id="cardInner" class="w-full h-full relative transform-style-3d flip-card-inner">
                    
                    <!-- FRENTE: Pergunta e Alternativas -->
                    <div class="absolute w-full h-full backface-hidden clean-card flex flex-col">
                        <div class="p-5 md:p-6 pb-4 border-b border-slate-100 shrink-0">
                            <h2 id="questionText" class="text-lg md:text-xl font-bold text-slate-800 leading-snug">Carregando pergunta...</h2>
                        </div>
                        
                        <!-- Container rolável para alternativas (resolve o corte no celular) -->
                        <div id="optionsContainer" class="p-4 md:p-5 flex flex-col gap-3 overflow-y-auto scrollable-content flex-1">
                            <!-- Botões Injetados via JS -->
                        </div>
                    </div>

                    <!-- VERSO: Feedback -->
                    <div class="absolute w-full h-full backface-hidden clean-card rotate-y-180 flex flex-col justify-between overflow-hidden">
                        <div id="feedbackHeader" class="p-6 pb-2 text-center shrink-0">
                            <div id="feedbackIcon" class="w-16 h-16 mx-auto mb-3 rounded-full flex items-center justify-center text-4xl text-white shadow-md"></div>
                            <h2 id="feedbackTitle" class="text-2xl font-bold mb-1"></h2>
                        </div>
                        
                        <!-- Explicação rolável caso seja muito grande -->
                        <div class="px-6 pb-6 overflow-y-auto scrollable-content flex-1 flex items-center justify-center">
                            <p id="feedbackExplanation" class="text-slate-600 text-center text-sm md:text-base leading-relaxed"></p>
                        </div>

                        <div class="p-5 bg-slate-50 border-t border-slate-100 rounded-b-[1.5rem] shrink-0">
                            <button id="nextBtn" class="bg-[#0284c7] text-white font-bold py-3.5 px-6 rounded-xl w-full hover:bg-sky-700 transition shadow-md active:scale-95">
                                Continuar
                            </button>
                        </div>
                    </div>

                </div>
            </div>
        </main>
    </div>

    <script>
        // --- BASE DE DADOS (Inalterada no conteúdo, apenas a lógica de acesso mudará) ---
        const originalQuestions = [
            { q: "O que é a gestão do tempo?", options: ["Fazer múltiplas tarefas ao mesmo tempo", "Planejar e priorizar o tempo dedicado a tarefas com estratégia", "Trabalhar sem pausas para terminar mais rápido", "Anotar tudo que precisa ser feito em post-its"], answer: 1, explanation: "A gestão do tempo é o ato estratégico de organizar as tarefas para cumprir prazos e reduzir o estresse diário." },
            { q: "Qual é o principal objetivo da Matriz de Eisenhower?", options: ["Organizar o ambiente físico", "Dividir tarefas em blocos de 25 minutos", "Classificar tarefas com base em urgência e importância", "Criar padrões para nomear arquivos digitais"], answer: 2, explanation: "A matriz cria quadrantes que cruzam urgência e importância para definir prioridades." },
            { q: "Na Matriz de Eisenhower, o que fazer com uma tarefa 'Importante e Urgente'?", options: ["Agendar para depois", "Delegar para outra pessoa", "Eliminar da rotina", "Fazer imediatamente (Faça agora)"], answer: 3, explanation: "Demandas de alto impacto com prazos curtos devem ser resolvidas imediatamente." },
            { q: "O que fazer com uma tarefa 'Importante, mas não urgente'?", options: ["Fazer agora", "Agendar para o médio ou longo prazo", "Delegar", "Eliminar"], answer: 1, explanation: "Essas tarefas garantem metas futuras e evitam crises. Decida e agende quando fazer." },
            { q: "O que fazer com uma tarefa 'Urgente, mas não importante'?", options: ["Fazer agora mesmo", "Adiar sem prazo", "Delegar ou adiar", "Focar 100% nela"], answer: 2, explanation: "Elas devem ser delegadas ou adiadas para não consumirem o tempo das suas prioridades." },
            { q: "O que fazer com atividades 'Não importantes e não urgentes'?", options: ["Eliminar ou evitar", "Deixar para o final do dia", "Delegar", "Fazer aos fins de semana"], answer: 0, explanation: "São puras distrações e perdas de tempo que não agregam aos seus objetivos." },
            { q: "Estudar para uma prova agendada para amanhã é um exemplo de qual quadrante?", options: ["Importante, mas não urgente", "Urgente, mas não importante", "Não importante nem urgente", "Importante e Urgente"], answer: 3, explanation: "O impacto é alto (nota) e o prazo está esgotando (amanhã)." },
            { q: "Rolar o feed das redes sociais sem propósito durante o estudo é:", options: ["Não Importante e Não Urgente", "Importante, mas não urgente", "Urgente, mas não importante", "Importante e Urgente"], answer: 0, explanation: "É uma distração pura que deve ser eliminada durante o foco produtivo." },
            { q: "Organizar o espaço de estudo para a próxima semana é um exemplo de:", options: ["Importante e Urgente", "Importante, mas Não Urgente", "Urgente, mas Não Importante", "Não Importante e Não Urgente"], answer: 1, explanation: "Tem grande impacto no bem-estar, mas não tem um prazo imediato estourando." },
            { q: "Responder mensagens banais no WhatsApp é um exemplo de:", options: ["Importante e Urgente", "Importante, mas Não Urgente", "Urgente, mas Não Importante", "Não Importante e Não Urgente"], answer: 2, explanation: "A notificação gera urgência, mas o conteúdo raramente tem importância real." },
            { q: "Qual é um erro comum na gestão estratégica do tempo?", options: ["Usar agenda virtual", "Pensar que tudo que é importante tem que ser feito agora", "Fazer pausas durante o trabalho", "Limpar a mesa de trabalho"], answer: 1, explanation: "Muitas tarefas são importantes, mas não têm prazo para hoje. É preciso saber diferenciar urgência de importância." },
            { q: "O que é a técnica Pomodoro?", options: ["Um sistema de arquivos na nuvem", "Um método de limpeza japonesa", "Anotar tudo em um calendário físico", "Um método que divide o trabalho em blocos de foco e pausas"], answer: 3, explanation: "A técnica intercala foco intenso com pequenos momentos de descanso programado." },
            { q: "Qual é a estrutura padrão de tempo da técnica Pomodoro?", options: ["50 min de foco / 10 min de pausa", "25 min de foco / 5 min de pausa", "1 hora de foco / sem pausa", "15 min de foco / 15 min de pausa"], answer: 1, explanation: "O padrão original utiliza blocos de 25 minutos de foco ininterrupto seguidos por 5 de descanso." },
            { q: "Qual é o principal benefício da técnica Pomodoro?", options: ["Evitar o esgotamento mental (fadiga)", "Organizar pastas no computador", "Definir prioridades de longo prazo", "Substituir o uso de agendas"], answer: 0, explanation: "As pausas constantes mantêm o cérebro ágil e evitam o cansaço extremo." },
            { q: "O que envolve a organização do trabalho?", options: ["Apenas manter a mesa limpa", "Apenas cumprir horários de entrada", "Definir tarefas, organizar tempo, ambiente e acompanhar atividades", "Trabalhar sempre em equipe"], answer: 2, explanation: "É um conjunto sistêmico que une planejamento mental, estrutural e execução." },
            { q: "Qual o impacto do ambiente físico no trabalho e estudo?", options: ["Não tem impacto se o computador for bom", "Afeta diretamente a produtividade e o foco", "Impacta apenas a aparência do local", "Gera mais tarefas urgentes"], answer: 1, explanation: "Um ambiente limpo e organizado reduz distrações e facilita a concentração." },
            { q: "O que é o método 5S?", options: ["Um aplicativo de agenda", "Um modelo de computador", "Uma técnica de pomodoro modificada", "Um método japonês para organizar e padronizar o ambiente"], answer: 3, explanation: "Os 5 princípios (Seiri, Seiton, Seiso, Seiketsu, Shitsuke) focam na eficiência do espaço físico e digital." },
            { q: "O que propõe o Senso de Utilização (Seiri)?", options: ["Criar padrões de nomes", "Separar o necessário do desnecessário", "Limpar o chão", "Trabalhar mais rápido"], answer: 1, explanation: "O primeiro passo é descartar ou arquivar tudo o que não tem utilidade imediata." },
            { q: "O que propõe o Senso de Organização (Seiton)?", options: ["Guardar tudo na gaveta", "Definir um lugar específico para cada item", "Limpar o computador", "Fazer backup diário"], answer: 1, explanation: "A regra é: um lugar para cada coisa e cada coisa em seu lugar." },
            { q: "Esvaziar a lixeira e apagar downloads inúteis no PC faz parte do:", options: ["Senso de Disciplina (Shitsuke)", "Senso de Organização (Seiton)", "Senso de Limpeza (Seiso)", "Senso de Padronização (Seiketsu)"], answer: 2, explanation: "O Seiso (Limpeza) se aplica tanto ao ambiente físico quanto à 'sujeira' digital." },
            { q: "Nomear arquivos escolares sempre no mesmo formato (ex: materia_data) aplica qual senso?", options: ["Senso de Limpeza (Seiso)", "Senso de Utilização (Seiri)", "Senso de Padronização (Seiketsu)", "Senso de Disciplina (Shitsuke)"], answer: 2, explanation: "A criação de regras fixas e padrões visuais é a base do Seiketsu." },
            { q: "Praticar a organização como um hábito constante e diário representa o:", options: ["Senso de Disciplina (Shitsuke)", "Senso de Padronização (Seiketsu)", "Senso de Limpeza (Seiso)", "Senso de Organização (Seiton)"], answer: 0, explanation: "A disciplina é o que mantém os outros quatro sensos funcionando a longo prazo." },
            { q: "Qual é a principal função do Google Agenda?", options: ["Editar planilhas", "Centralizar compromissos, criar alertas e evitar choques de horários", "Fazer videochamadas", "Armazenar fotos"], answer: 1, explanation: "Funciona como um 'cérebro digital' para gerenciar blocos de tempo." },
            { q: "Qual o risco de confiar apenas na memória e não usar ferramentas de gestão?", options: ["Nenhum, a memória é mais rápida", "Ficar dependente da tecnologia", "Esquecer tarefas, perder prazos e acumular estresse", "Perder a criatividade"], answer: 2, explanation: "A memória humana é falha para gerenciar múltiplas demandas, gerando ansiedade." },
            { q: "Qual é a melhor forma de visualização no Google Agenda para identificar espaços livres?", options: ["Visão Diária", "Visão Mensal", "Visão Semanal", "Visão Anual"], answer: 2, explanation: "A visão semanal permite enxergar a distribuição dos dias e identificar sobrecargas facilmente." },
            { q: "O que significa quando o Google Agenda exibe blocos visuais sobrepostos?", options: ["Que o sistema travou", "Um choque/conflito de horários que precisa ser resolvido", "Que as tarefas estão concluídas", "Que as tarefas são do mesmo projeto"], answer: 1, explanation: "A sobreposição indica fisicamente que você agendou duas coisas para a mesma hora." },
            { q: "O que é crucial considerar ao agendar tarefas em locais físicos diferentes?", options: ["A cor da tarefa", "O número de participantes", "O tempo de deslocamento", "O clima do dia"], answer: 2, explanation: "Ignorar o trânsito ou a locomoção entre eventos gera atrasos inevitáveis." },
            { q: "Como resolver o surgimento de uma reunião urgente usando a agenda virtual?", options: ["Deletar todas as outras tarefas do dia", "Arrastar tarefas menos urgentes para outro dia ou horário para abrir espaço", "Fazer as duas coisas ao mesmo tempo", "Ignorar a reunião urgente"], answer: 1, explanation: "A redução de tempo de tarefas menos urgentes é a chave." },
            { q: "O que a Matriz de Eisenhower ajuda a evitar no ambiente de trabalho?", options: ["A criação de planilhas", "Viver 'apagando incêndios' sem focar no longo prazo", "O uso de agendas", "O excesso de organização"], answer: 1, explanation: "Ela força a focar no que é importante antes que se torne uma urgência ou crise." },
            { q: "Por que as pausas do Pomodoro (5 min) são importantes?", options: ["Para responder e-mails urgentes", "Para adiantar tarefas da faculdade", "Para descansar a mente e manter o desempenho cognitivo nas próximas sessões", "Para organizar arquivos no computador"], answer: 2, explanation: "A pausa deve ser de desconexão total para permitir a recuperação neural." }
        ];

        // --- SISTEMA E VARIÁVEIS ---
        let questions = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let answered = false;
        
        // Timer Variables
        const TIME_PER_QUESTION = 20; // 20 segundos
        let timeLeft = TIME_PER_QUESTION;
        let timerInterval;

        // Elementos da DOM
        const scoreDisplay = document.getElementById('scoreDisplay');
        const timerBar = document.getElementById('timerBar');
        const timerText = document.getElementById('timerText');
        const cardInner = document.getElementById('cardInner');
        const questionCounter = document.getElementById('questionCounter');
        const questionText = document.getElementById('questionText');
        const optionsContainer = document.getElementById('optionsContainer');
        const feedbackIcon = document.getElementById('feedbackIcon');
        const feedbackTitle = document.getElementById('feedbackTitle');
        const feedbackExplanation = document.getElementById('feedbackExplanation');
        const nextBtn = document.getElementById('nextBtn');
        const gameContainer = document.getElementById('gameContainer');
        const endScreen = document.getElementById('endScreen');

        // Embaralhador (Algoritmo Fisher-Yates)
        function shuffleArray(array) {
            let shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        // Inicialização
        function initGame() {
            // Embaralha as questões para que nunca repita a ordem
            questions = shuffleArray(originalQuestions);
            currentQuestionIndex = 0;
            score = 0;
            scoreDisplay.textContent = '0';
            loadQuestion();
        }

        function startTimer() {
            clearInterval(timerInterval);
            timeLeft = TIME_PER_QUESTION;
            updateTimerVisuals();

            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerVisuals();

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    handleTimeOut();
                }
            }, 1000);
        }

        function updateTimerVisuals() {
            const percentage = (timeLeft / TIME_PER_QUESTION) * 100;
            timerBar.style.width = `${percentage}%`;
            timerText.textContent = `${timeLeft}s restantes`;

            // Muda de cor quando o tempo está acabando (menos de 6 segundos)
            if (timeLeft <= 5) {
                timerBar.style.backgroundColor = 'var(--accent-red)';
                timerText.classList.add('text-red-500');
            } else {
                timerBar.style.backgroundColor = 'var(--primary-green)';
                timerText.classList.remove('text-red-500');
            }
        }

        function loadQuestion() {
            answered = false;
            cardInner.classList.remove('rotate-y-180'); 
            
            const q = questions[currentQuestionIndex];
            questionCounter.textContent = `Questão ${currentQuestionIndex + 1} / ${questions.length}`;
            questionText.textContent = q.q;
            
            // Renderiza opções com layout limpo
            optionsContainer.innerHTML = '';
            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'w-full text-left bg-white border border-slate-200 p-3.5 rounded-xl hover:border-[#0284c7] hover:bg-sky-50 transition-colors font-medium text-slate-700 active:scale-95 text-sm md:text-base flex items-center gap-3 shadow-sm';
                btn.innerHTML = `<span class="shrink-0 w-7 h-7 rounded-full bg-slate-100 border border-slate-200 flex items-center justify-center text-slate-500 text-xs font-bold">${String.fromCharCode(65 + index)}</span> <span>${opt}</span>`;
                btn.onclick = () => handleAnswer(index);
                optionsContainer.appendChild(btn);
            });

            // Aguarda a animação da carta para reiniciar o tempo
            setTimeout(startTimer, 300);
        }

        function handleAnswer(selectedIndex) {
            if (answered) return;
            answered = true;
            clearInterval(timerInterval); // Para o relógio

            const q = questions[currentQuestionIndex];
            const isCorrect = selectedIndex === q.answer;

            setFeedbackUi(isCorrect ? 'correct' : 'incorrect', q);
        }

        function handleTimeOut() {
            if (answered) return;
            answered = true;
            
            const q = questions[currentQuestionIndex];
            setFeedbackUi('timeout', q);
        }

        function setFeedbackUi(status, questionData) {
            if (status === 'correct') {
                score++;
                scoreDisplay.textContent = score;
                feedbackIcon.className = 'w-16 h-16 mx-auto mb-3 rounded-full flex items-center justify-center text-4xl text-white shadow-md bg-[#10b981] shadow-emerald-200';
                feedbackIcon.innerHTML = '✓';
                feedbackTitle.textContent = 'Acertou!';
                feedbackTitle.className = 'text-2xl font-bold mb-1 text-[#10b981]';
            } else if (status === 'incorrect') {
                feedbackIcon.className = 'w-16 h-16 mx-auto mb-3 rounded-full flex items-center justify-center text-4xl text-white shadow-md bg-[#ef4444] shadow-red-200';
                feedbackIcon.innerHTML = '✕';
                feedbackTitle.textContent = 'Ops, Incorreto!';
                feedbackTitle.className = 'text-2xl font-bold mb-1 text-[#ef4444]';
            } else if (status === 'timeout') {
                feedbackIcon.className = 'w-16 h-16 mx-auto mb-3 rounded-full flex items-center justify-center text-4xl text-white shadow-md bg-[#f59e0b] shadow-amber-200';
                feedbackIcon.innerHTML = '⏱️';
                feedbackTitle.textContent = 'Tempo Esgotado!';
                feedbackTitle.className = 'text-2xl font-bold mb-1 text-[#f59e0b]';
            }

            feedbackExplanation.innerHTML = `<strong class="text-slate-700">A resposta correta era:</strong><br><span class="text-slate-800 bg-slate-100 p-2 rounded block mt-1 mb-3 border border-slate-200">${questionData.options[questionData.answer]}</span> <span class="text-slate-600 block leading-relaxed">${questionData.explanation}</span>`;
            
            cardInner.classList.add('rotate-y-180');
        }

        nextBtn.onclick = () => {
            currentQuestionIndex++;
            cardInner.classList.remove('rotate-y-180');
            
            setTimeout(() => {
                if (currentQuestionIndex < questions.length) {
                    loadQuestion();
                } else {
                    showEndScreen();
                }
            }, 300); 
        };

        function showEndScreen() {
            clearInterval(timerInterval);
            gameContainer.classList.add('hidden');
            endScreen.classList.remove('hidden');
            document.getElementById('finalScore').textContent = score;
        }

        // Inicia
        initGame();
    </script>
</body>
</html>
